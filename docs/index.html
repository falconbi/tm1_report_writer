<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Falcon BI — Report Writer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0e0c09;
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 52px;
      background: rgba(14,12,9,0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .nav-logo {
      display: flex; align-items: center; gap: 10px; text-decoration: none;
    }
    .nav-logo svg { width: 24px; height: 24px; }
    .nav-logo span {
      font-size: 14px; font-weight: 700;
      color: #f5ede0; letter-spacing: -0.2px;
    }

    nav a.docs-link {
      font-size: 13px; color: #7a6e5c; text-decoration: none;
      padding: 6px 14px; border-radius: 6px; transition: color .15s;
    }
    nav a.docs-link:hover { color: #d4c4a8; }

    .spread {
      padding-top: 52px;
      min-height: calc(100vh - 52px);
      background: #0e0c09;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .spread img {
      width: 100%;
      max-width: 1672px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <nav>
    <a href="docs.html" class="nav-logo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 7 C13 5 9 5 5 6.5 L5 26 C9 24.5 13 24.5 16 26.5 C19 24.5 23 24.5 27 26 L27 6.5 C23 5 19 5 16 7Z"
              stroke="#e8a020" stroke-width="2" stroke-linejoin="round" fill="#e8a020" fill-opacity="0.05"/>
        <line x1="16" y1="7" x2="16" y2="26.5" stroke="#e8a020" stroke-width="2"/>
      </svg>
      <span>Falcon BI</span>
    </a>
    <a href="docs.html" class="docs-link">Documentation</a>
  </nav>

  <div class="spread">
    <img src="images/Report-Spread.png" alt="Toy Story Airways — Report Writer output" />
  </div>

</body>
</html>
